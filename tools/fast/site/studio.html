<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WX Models: Studio</title>
<script>if(!new URLSearchParams(location.search).has("studio"))history.replaceState(null,"",location.pathname+(location.search?location.search+"&":"?")+"studio=1"+location.hash)</script>
<link rel="preload" href="fonts/Montserrat-sub.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:Montserrat;src:url(fonts/Montserrat-sub.woff2) format("woff2"),url(fonts/Montserrat.ttf) format("truetype");font-weight:100 900}
html,body{margin:0;background:#15171c;color:#f4f2ee;font:14px Montserrat,system-ui,sans-serif}
/* 10-29 7:10 PM: whole map + controls fit the window, no scrolling (Benjamin: "make the zoom on the images less") */
html,body{height:100%;overflow:hidden}
body{display:flex;flex-direction:column;height:100vh;height:100dvh}
#bar{flex:0 0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 12px;background:#1d2027;border-bottom:1px solid #2c3039}
#bar select,#bar button{background:#262931;color:#f4f2ee;border:1px solid #7d828c;border-radius:6px;padding:4px 8px;font:inherit}
#bar input[type=range]{flex:1;min-width:200px}
/* 10-29 8:45 PM slider fix: no page pan / rubber-band while dragging, bigger thumb, no tap delay on buttons */
html,body{overscroll-behavior:none}
#bar button,#bar select{touch-action:manipulation}
#step{-webkit-appearance:none;appearance:none;background:transparent;height:32px;margin:0;touch-action:none;cursor:pointer}
#step::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:#3a3f4a}
#step::-moz-range-track{height:8px;border-radius:4px;background:#3a3f4a}
#step::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-10px;border-radius:50%;background:#2f8cff;border:3px solid #f4f2ee;box-shadow:0 1px 4px #0008}
#step::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#2f8cff;border:3px solid #f4f2ee}
#stat{color:#a7abb3;font-size:12px;min-width:260px}
#loadnote{display:none;color:#ffd27a;font-size:12px;font-weight:600;white-space:nowrap;padding:3px 8px;border:1px solid #6b5a2e;border-radius:10px;background:#2a2416}
#loadnote.on{display:inline-block}
body.phone #loadnote{font-size:11px;padding:2px 6px;flex:0 0 auto}
body.phone #dock #step{min-width:90px}
#wrap{position:relative;flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;padding:4px;box-sizing:border-box}
/* 10-30 7:50 PM (Benjamin's iPhone screenshots: whole map blurry, buttons sharp): no will-change:transform on the map. Safari/WebKit
   rasterizes a will-change:transform layer once at 1x and stretches it (3x on an iPhone), so the canvas showed at a third of its res. */
canvas{display:block;width:auto;height:auto;max-width:100%;max-height:100%;touch-action:none}
#zreset{position:absolute;right:10px;top:10px;z-index:2;background:#262931ee;color:#f4f2ee;border:1px solid #7d828c;border-radius:6px;padding:5px 10px;font:inherit;font-size:13px;cursor:pointer}
#tip{position:absolute;pointer-events:none;background:#1d2027ee;color:#fff;border:1px solid #7d828c;border-radius:6px;padding:3px 8px;font-weight:700;font-size:14px;white-space:nowrap}
@media (max-width:1500px){#stat{display:none}}
@media (max-width:700px){#wrap{align-items:flex-start}}
@media (max-width:700px),(max-height:500px){#bar{gap:6px;padding:6px}#bar label{font-size:12px}#bar select{max-width:42vw}#bar button{padding:5px 10px}#wrap{padding:2px}}
@media (max-width:700px){#bar input[type=range]{min-width:100%;order:9;height:28px}}
@media (max-height:500px) and (min-width:701px){#bar label{font-size:0}#bar label select{font-size:12px}#bar input[type=range]{min-width:120px}}
body.bare #bar{display:none}
/* side-by-side frames (compare.html): no page-level extras, smaller bar */
body.embed #share,body.embed #obsbtn,body.embed #stat,body.embed #pfbtn{display:none}
body.embed #bar{gap:6px;padding:6px 8px}
/* 10-29 9:01 PM (Benjamin): on phones the hour slider + step buttons sit UNDER the map (thumb no longer covers it);
   the map hugs the slider at the bottom of the screen, menus stay on top. Desktop unchanged. viewer.js moves #stepctl. */
#stepctl{display:contents}

body.phone #dock{flex:0 0 auto;display:flex;gap:8px;align-items:center;padding:6px 10px calc(8px + env(safe-area-inset-bottom));background:#1d2027;border-top:1px solid #2c3039}
body.phone #dock #stepctl{display:flex;gap:8px;align-items:center;flex:1;min-width:0}
body.phone #dock button{background:#262931;color:#f4f2ee;border:1px solid #7d828c;border-radius:6px;padding:6px 12px;font:inherit;touch-action:manipulation}
body.phone #dock #step{flex:1;min-width:0;order:0;height:36px}
/* 10-29 9:16 PM: stack = menus, map, slider bar; leftover space at the bottom. viewer.js fitPhone() sizes the map. */
body.phone #wrap{flex:0 0 auto;align-items:flex-start}
body.phone canvas{max-height:none}
#saveview{position:fixed;inset:0;z-index:20;background:#000e;display:flex;flex-direction:column}
#saveview .sv-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 12px;background:#1d2027;font-size:13px}
#saveview .sv-top span{flex:1}
#saveview a,#saveview button{background:#262931;color:#f4f2ee;border:1px solid #7d828c;border-radius:6px;padding:5px 10px;font:inherit;text-decoration:none}
#saveview img{flex:1;min-height:0;width:100%;object-fit:contain;-webkit-touch-callout:default;user-select:auto}
/* 10-30 stage 5: meteogram / Pass Forecaster overlay (map page underneath is unchanged) */
#mg{position:fixed;inset:0;z-index:15;background:#15171c;display:flex;flex-direction:column}
#mg .mg-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 12px;background:#1d2027;border-bottom:1px solid #2c3039}
#mg select,#mg button{background:#262931;color:#f4f2ee;border:1px solid #7d828c;border-radius:6px;padding:5px 8px;font:inherit;touch-action:manipulation}
#mg #mgpage{margin-left:auto;color:#f4f2ee;background:#262931;border:1px solid #7d828c;border-radius:6px;padding:5px 8px;text-decoration:none;font-size:13px}#mg #mgpage+#mgx{margin-left:0}#mg #mgx{margin-left:auto}
#obsov{position:fixed;inset:0;z-index:15;background:#15171c;display:flex;flex-direction:column}
#obsov .mg-top{display:flex;gap:10px;align-items:center;padding:8px 12px;background:#1d2027;border-bottom:1px solid #2c3039}
#obsov button{background:#262931;color:#f4f2ee;border:1px solid #7d828c;border-radius:6px;padding:5px 8px;font:inherit}
#obsov #obsx{margin-left:auto}
#obsov #obs-root{flex:1;min-height:0;position:relative}
#obsov[hidden]{display:none}
#pfbtn .sm,#mgpage .sm,#obsbtn .sm{display:none}@media (max-width:700px){#pfbtn .lg,#mgpage .lg,#obsbtn .lg{display:none}#pfbtn .sm,#mgpage .sm,#obsbtn .sm{display:inline}#mg #mgpage{padding:5px 6px}}
#mgbody{flex:1;min-height:0;overflow:auto;padding:4px 8px calc(8px + env(safe-area-inset-bottom))}
#mgbody canvas{display:block}
.mg-msg{padding:20px;color:#a7abb3}.mg-note{color:#a7abb3;font-size:12px;padding:6px 4px}
.mg-scroll{overflow-x:auto}
table.pf{border-collapse:collapse;font-size:13px;min-width:100%}
table.pf th{position:sticky;top:0;background:#1d2027;font-weight:700;padding:6px 8px;text-align:right;border-bottom:1px solid #2c3039;white-space:nowrap}
table.pf th:first-child,table.pf td:first-child{text-align:left;position:sticky;left:0;background:#1d2027}
table.pf td{padding:6px 8px;text-align:right;border-bottom:1px solid #262931;white-space:nowrap}
table.pf tr[data-n]{cursor:pointer}table.pf tr[data-n]:hover td{background:#262931}
table.pf td small.el{color:#a7abb3;font-weight:500;font-size:11px}table.pf td.fzb{background:#1e4f7a;font-weight:800}table.pf th small{font-weight:500;color:#a7abb3}table.pf td.s1{background:#1f3b5c}table.pf td.s2{background:#2a5d96}table.pf td.s3{background:#4a3a9a;font-weight:800}
@media (max-width:700px){table.pf{font-size:12px}table.pf th,table.pf td{padding:5px 6px}#mg .mg-top{gap:6px;padding:6px}#mg .mg-top label{font-size:12px}#mg select{max-width:42vw}}
/* 10-30 8 PM product tabs (Surface / Precip / Snow / Upper Air / Severe): pills before the Product menu; phones: own row, fits 390 px */
#tabs{display:flex;gap:4px;flex:0 0 auto}
#tabs button{background:#262931;color:#cfd3da;border:1px solid #4a4f5a;border-radius:15px;padding:4px 11px;font:inherit;font-size:13px;font-weight:600;white-space:nowrap;touch-action:manipulation;cursor:pointer}
#tabs button.on{background:#2f8cff;border-color:#2f8cff;color:#fff}
@media (max-width:700px){#tabs{flex:1 1 100%;gap:4px;overflow-x:auto;scrollbar-width:none}#tabs::-webkit-scrollbar{display:none}#tabs button{padding:5px 9px;font-size:12.5px}}

/* Studio (10-31): the normal map is drawn off-screen (sharp, 2-3x) and cropped into two fixed video frames */
html,body{overflow:auto}
#wrap{position:absolute!important;left:-100000px;top:0;width:1600px;height:1050px;overflow:hidden}

#studio{flex:1 1 auto;display:flex;gap:18px;padding:12px 14px;align-items:flex-start;min-height:0}
.sfr{display:flex;flex-direction:column;gap:6px;min-width:0}
.sfr .shd{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:#cfd3da}
.sfr .shd b{color:#f4f2ee}
.sfr button,.sfr a{background:#262931;color:#f4f2ee;border:1px solid #7d828c;border-radius:6px;padding:3px 8px;font:inherit;font-size:12.5px;cursor:pointer;text-decoration:none}
.sfr input[type=range]{width:110px;accent-color:#2f8cff}
.sfr canvas{display:block;background:repeating-conic-gradient(#202329 0 25%,#191b20 0 50%) 0 0/24px 24px;outline:1px solid #3a3f49;cursor:grab;touch-action:none}
.sfr canvas:focus{outline:2px solid #2f8cff}
.sfr canvas.drag{cursor:grabbing}
#fv canvas{height:calc(100vh - 150px);height:calc(100dvh - 150px);width:auto;aspect-ratio:9/16}
#fh{flex:1 1 auto}#fh canvas{width:100%;height:auto;aspect-ratio:16/9;max-height:calc(100vh - 150px)}
.shint{color:#8e939c;font-size:12px}
@media (max-width:820px){body{display:block;height:auto}#studio{display:block}.sfr{margin-bottom:16px}#fv canvas{height:auto;width:100%}#fh canvas{max-height:none}#bar{position:sticky;bottom:0;z-index:5}}
/* clean mode (OBS Browser Source): one frame at its real size, no UI */
body.clean{background:var(--sbg,#111316);display:block;height:auto;overflow:hidden}
body.clean #bar,body.clean #dock,body.clean .shd,body.clean .shint,body.clean #tip{display:none!important}
body.clean #studio{padding:0;gap:0;display:block}
body.clean .sfr{display:none}body.clean .sfr.on{display:block}
body.clean .sfr canvas,body.clean #fv canvas,body.clean #fh canvas{width:auto!important;height:auto!important;max-height:none!important;outline:0;background:none;cursor:default}
</style></head>
<body>
<div id="bar">
  <label>Runs <select id="run" aria-label="Runs"></select></label>
  <div id="tabs" role="tablist" aria-label="Product groups"></div>
  <label>Product <select id="prod"></select></label>
  <label>View <select id="view"></select></label>
  <span id="stepctl"><button id="prev">&lsaquo;</button><button id="play">Play</button><button id="next">&rsaquo;</button>
  <input id="step" type="range" min="0" max="0" value="0"><span id="loadnote" title="This run is still coming in; new hours appear here automatically"></span></span>
  <button id="save" title="Save this map as a picture">Save image</button>
  <button id="share">Share</button>
  <button id="mgbtn" title="Hour-by-hour forecast for a town or pass">Meteogram</button>
  <button id="pfbtn" title="Snow, temperature and wind for every mountain pass"><span class="lg">Pass Forecaster</span><span class="sm">Passes</span></button>
  <button id="obsbtn" title="Live station observations (NWS / Environment Canada)"><span class="lg">Observations</span><span class="sm">Obs</span></button>
  <span id="stat"></span>
</div>
<div id="wrap"><canvas id="map"></canvas><div id="tip" hidden></div></div>
<div id="studio">
  <div class="sfr" id="fv"><div class="shd"><b>9:16</b> 1080&times;1920 &middot; zoom <input type="range" id="zv" min="100" max="250" value="100"> <button type="button" data-a="reset">Reset</button> <button type="button" data-a="png">Save PNG</button> <button type="button" data-a="obs">Copy OBS URL</button></div><canvas id="cv" width="1080" height="1920" tabindex="0"></canvas></div>
  <div class="sfr" id="fh"><div class="shd"><b>16:9</b> 1920&times;1080 &middot; zoom <input type="range" id="zh" min="100" max="250" value="100"> <button type="button" data-a="reset">Reset</button> <button type="button" data-a="png">Save PNG</button> <button type="button" data-a="obs">Copy OBS URL</button></div><canvas id="ch" width="1920" height="1080" tabindex="0"></canvas>
  <div class="shint">Drag a frame to line the map up (arrow keys 1 px, Shift 10 px, +/- zoom, 0 reset). Framing is saved per frame and view.</div></div>
</div>
<div id="dock"></div>
<script src="viewer.js?v=20261031s"></script>
<script src="studio.js?v=20261031a"></script>
</body></html>
