<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WX Models: Compare</title>
<style>
@font-face{font-family:Montserrat;src:url(fonts/Montserrat-sub.woff2) format("woff2");font-weight:100 900}
html,body{margin:0;height:100%;background:#15171c;color:#f4f2ee;font:14px Montserrat,system-ui,sans-serif}
body{display:flex;flex-direction:column;height:100vh;height:100dvh}
#cbar{flex:0 0 auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:7px 12px;background:#1d2027;border-bottom:1px solid #2c3039}
#cbar a,#cbar button{background:#262931;color:#f4f2ee;border:1px solid #7d828c;border-radius:6px;padding:4px 9px;font:inherit;text-decoration:none;cursor:pointer}
#cbar b{font-weight:800;letter-spacing:.02em}
#cbar label{display:inline-flex;gap:5px;align-items:center;color:#cfd3da;white-space:nowrap}
#cbar input{accent-color:#2f8cff;width:16px;height:16px}
#cbar .hint{color:#8e939c;font-size:12px}
#panes{flex:1 1 auto;display:flex;min-height:0}
#panes iframe{border:0;min-width:0;height:100%}
#syncs{display:inline-flex;gap:12px;align-items:center;flex-wrap:wrap}#syncbtn{display:none}
/* 10-31 3:17 PM (Benjamin: "the second widescreen map needs to be the bigger one because people will be watching that on YouTube on
   their TVs"): the second (right) map is the main one, about 2/3 of the width; one shared hour slider for both */
#L{flex:0 0 36%}#R{flex:1 1 64%}
#hbar{flex:0 0 auto;display:flex;gap:8px;align-items:center;padding:5px 12px;background:#1d2027;border-bottom:1px solid #2c3039}
#hbar button,#hbar a{background:#262931;color:#f4f2ee;border:1px solid #7d828c;border-radius:6px;padding:4px 10px;font:inherit;text-decoration:none;cursor:pointer;touch-action:manipulation}
#hbar #tv{background:#2f8cff;border-color:#2f8cff;font-weight:700}
#hstep{flex:1;min-width:80px;accent-color:#2f8cff;height:28px}#hlbl{color:#ffc24d;font-weight:700;white-space:nowrap;font-size:13px}
.cap{display:none}
#panes .sep{flex:0 0 3px;background:#2f8cff55}
/* phones: the two maps stacked, page scrolls */
@media (max-width:820px){html,body{height:auto}body{height:auto;display:block}#panes{display:flex;flex-direction:column}
  #panes iframe{display:block;width:100%;height:320px}#panes .sep{display:none}#cbar{gap:8px;padding:6px 8px;font-size:13px}#cbar .hint{display:none}
  #panes #R{order:1}#capR{order:0}#capL{order:2}#panes #L{order:3;width:64%;margin:0 auto 8px}#syncbtn{display:inline-block}
  .cap{display:block;color:#8e939c;font-size:11.5px;padding:4px 10px 2px}
  #hbar{position:sticky;top:0;z-index:5;padding:5px 8px;flex-wrap:wrap}#hlbl{flex-basis:100%;order:5;font-size:12px}#syncs{display:none}#cbar.open #syncs{display:inline-flex}}

</style></head>
<body>
<div id="cbar">
  <a href="./" id="back" title="Back to the single map">&lsaquo; Maps</a>
  <b>Compare</b>
  <button type="button" id="syncbtn" title="Sync and swap options">Options</button>
  <span id="syncs"><span>Sync:</span>
  <label><input type="checkbox" id="s_time" checked> Valid time</label>
  <label><input type="checkbox" id="s_prod" checked> Product</label>
  <label><input type="checkbox" id="s_view" checked> View</label>
  <button type="button" id="swap" title="Swap the two maps">Swap</button></span>
  <span class="hint">Pick any model / run / product / hour in either map. Same model in both = compare two runs.</span>
</div>
<div id="hbar"><button type="button" id="hprev" aria-label="Previous hour">&lsaquo;</button><button type="button" id="hplay">Play</button><button type="button" id="hnext" aria-label="Next hour">&rsaquo;</button>
  <input type="range" id="hstep" min="0" max="0" value="0" aria-label="Hour (both maps)"><span id="hlbl"></span>
  <button type="button" id="tv" title="Open the main (widescreen) map as a clean 16:9 frame for YouTube / OBS / a TV, playing through the run">TV 16:9</button></div>
<div id="panes"><div class="cap" id="capR">Main map (widescreen, for TV / YouTube)</div><iframe id="L" title="Second map (small)"></iframe><div class="sep"></div><iframe id="R" title="Main map (widescreen)"></iframe><div class="cap" id="capL">Second map</div></div>
<script src="compare.js"></script>
</body></html>
