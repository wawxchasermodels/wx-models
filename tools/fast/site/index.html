<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WX Models fast maps (HRRR preview)</title>
<link rel="preload" href="fonts/Montserrat-sub.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:Montserrat;src:url(fonts/Montserrat-sub.woff2) format("woff2"),url(fonts/Montserrat.ttf) format("truetype");font-weight:100 900}
html,body{margin:0;background:#15171c;color:#f4f2ee;font:14px Montserrat,system-ui,sans-serif}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 12px;background:#1d2027;border-bottom:1px solid #2c3039}
#bar select,#bar button{background:#262931;color:#f4f2ee;border:1px solid #7d828c;border-radius:6px;padding:4px 8px;font:inherit}
#bar input[type=range]{flex:1;min-width:200px}
#stat{color:#a7abb3;font-size:12px;min-width:260px}
#wrap{max-width:1600px;margin:0 auto}
#wrap{position:relative}
canvas{display:block;width:100%;height:auto;touch-action:pan-y}
#tip{position:absolute;pointer-events:none;background:#1d2027ee;color:#fff;border:1px solid #7d828c;border-radius:6px;padding:3px 8px;font-weight:700;font-size:14px;white-space:nowrap}
@media (max-width:700px){#bar{gap:6px;padding:6px}#bar label{font-size:12px}#bar input[type=range]{min-width:100%;order:9;height:28px}#stat{display:none}#bar button{padding:6px 12px}}
body.bare #bar{display:none} body.bare #wrap{max-width:none}
</style></head>
<body>
<div id="bar">
  <label>Run <select id="run"></select></label>
  <label>Product <select id="prod"></select></label>
  <label>View <select id="view"></select></label>
  <button id="prev">&lsaquo;</button><button id="play">Play</button><button id="next">&rsaquo;</button>
  <input id="step" type="range" min="0" max="0" value="0">
  <button id="share">Share</button>
  <span id="stat"></span>
</div>
<div id="wrap"><canvas id="map"></canvas><div id="tip" hidden></div></div>
<script src="viewer.js"></script>
</body></html>
