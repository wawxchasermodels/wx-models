name: GFS

on:
  schedule:
    - cron: "15 5,11,17,23 * * *"
    - cron: "45 6,12,18,0 * * *"
  workflow_dispatch:
    inputs:
      init:
        description: Cycle YYYYMMDDHH. Leave blank for the newest complete GFS run.
        required: false
        default: ""
      hours:
        description: Comma-separated forecast hours. Leave blank for the full schedule.
        required: false
        default: ""

jobs:
  pipeline:
    uses: ./.github/workflows/pipeline.yml
    with:
      model: gfs
      init: ${{ inputs.init }}
      hours: ${{ inputs.hours }}
    secrets: inherit
