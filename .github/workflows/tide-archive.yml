# Tides viewer: every 6 h, refresh AIFS ENS pressure + SST + STOFS anomaly sidecars, then archive
# the STOFS-free Conditional snapshot (Benjamin 2026-11-14 ship). Writes to the orphan branch
# "tide-archive" (v1/<station>/<YYYY-MM>.json, v1/index.json, v1/sst.json, v1/aifs_ens_msl.json,
# v1/stofs_anom.json). The site reads them from raw.githubusercontent.com (public, CORS *).
# A 404 there must not break the page: tide.js uses the copy shipped with the site, or holds
# observed pressure / leaves the warm-water term at zero. No R2, no secrets: NOAA / ECMWF open
# data is public and the push uses this workflow's own GITHUB_TOKEN. No workflow here runs on
# push, so these commits trigger nothing.
# Issue slots 02/08/14/20 UTC (~30-60 min after each STOFS cycle lands). SST is refreshed every
# run (the analysis itself has a ~2-day latency).
name: tide-archive
on:
  schedule:
    - cron: "20 2,8,14,20 * * *"
  workflow_dispatch:
concurrency:
  group: tide-archive
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/fast/tide_archive
            tools/fast/site/tide/sst.json
          path: src
      - uses: actions/checkout@v4
        with:
          ref: tide-archive
          path: arch
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GRIB / netCDF libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libeccodes-dev libeccodes-tools libnetcdf-dev
          python -m pip install --quiet "numpy<2.3" eccodes netCDF4
      - name: Refresh AIFS ENS pressure, SST, and STOFS anomaly sidecars
        # Keep going if one sidecar fails: the snapshot and the page have persist / W=0 fallbacks.
        run: |
          python src/tools/fast/tide_archive/refresh_tide_sidecars.py \
            --out arch \
            --seed-sst src/tools/fast/site/tide/sst.json \
            --aifs-work "$RUNNER_TEMP/aifs_ens_msl" \
            || echo "sidecar refresh reported an error; archive will use whatever is already on the branch plus page fallbacks"
      - name: Snapshot (live STOFS-free residual; marks itself hindcast if the run is >3 h late)
        run: python src/tools/fast/tide_archive/tide_archive.py --out arch --issue now
      - name: Daily self-calibration, background only (new coefficients at the 08 UTC = 12 AM PST run; stored as rc/cal, not shown on the site)
        run: python src/tools/fast/tide_archive/calibrate.py --out arch --from now --to now
      - name: Commit and push
        working-directory: arch
        run: |
          git config user.name "tide-archive bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v1
          git diff --cached --quiet && exit 0
          git commit -q -m "tide archive $(date -u +%Y%m%dT%H%MZ)"
          for i in 1 2 3; do git push -q origin HEAD:tide-archive && exit 0; git pull -q --rebase origin tide-archive; done
          exit 1
